<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#05050a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#AA00FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spectrum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#6200EA"/>
      <stop offset="100%" stop-color="#D500F9"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <!-- Ambient glow -->
  <circle cx="16" cy="16" r="14" fill="url(#glow)"/>
  <!-- Outer hexagon -->
  <polygon points="16,4 26.4,10 26.4,22 16,28 5.6,22 5.6,10" fill="none" stroke="url(#spectrum)" stroke-width="0.8" opacity="0.6"/>
  <!-- Inner hexagon -->
  <polygon points="16,8 22.9,12 22.9,20 16,24 9.1,20 9.1,12" fill="none" stroke="url(#spectrum)" stroke-width="0.6" opacity="0.4"/>
  <!-- Center node -->
  <circle cx="16" cy="16" r="2" fill="#00E5FF" opacity="0.9"/>
  <circle cx="16" cy="16" r="3.5" fill="none" stroke="#00E5FF" stroke-width="0.4" opacity="0.3"/>
</svg>
